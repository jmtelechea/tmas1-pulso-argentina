name: Actualizar y publicar piloto
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: piloto
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar cálculos y controles
        run: python -m unittest discover -s tests -v
      - name: Descargar y analizar datos
        run: python scripts/update.py
      - name: Conservar datos y estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/evidence.json
          if [ -f automation-state.json ]; then git add automation-state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos y lectura del piloto"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
