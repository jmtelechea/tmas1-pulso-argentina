name: Actualizar y publicar piloto
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 21 * * 1-5'
  workflow_dispatch:
    inputs:
      test_email:
        description: Enviar un correo de prueba al destinatario del piloto
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: piloto
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar cálculos y controles
        run: python -m unittest discover -s tests -v
      - name: Descargar y analizar datos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python scripts/update.py
      - name: Enviar informe privado si está configurado
        if: github.event_name != 'push'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FREQUENCY: weekly
          MAIL_TEST: ${{ inputs.test_email && 'true' || 'false' }}
        run: python scripts/mail.py
      - name: Conservar datos y estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if [ -f automation-state.json ]; then git add automation-state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos y lectura del piloto"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
